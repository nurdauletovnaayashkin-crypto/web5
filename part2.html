<!DOCTYPE html>

  <main class="main-container">
    <div class="card">
      <h2>Task 2. Changing Content</h2>
      <p id="targetText">This is the original paragraph text.</p>
      <button class="btn-pink" id="changeTextBtn">Change Text</button>
    </div>

    <div class="card">
      <h2>Task 3. Changing Styles</h2>
      <div id="styleBox" style="padding: 1rem; border: 2px solid var(--berry); border-radius: 12px; margin-bottom: 1rem;">
        Text inside the styled block.
      </div>
      <button class="btn-pink" id="changeBgBtn">Change Background</button>
      <button class="btn-pink" id="changeFontBtn">Change Font Size</button>
    </div>

    <div class="card">
      <h2>Task 4. Creating & Removing Elements</h2>
      <button class="btn-pink" id="addItemBtn">Add Item</button>
      <button class="btn-pink" id="removeItemBtn">Remove Item</button>
      <ul id="itemList" style="margin-top: 1rem;">
        <li>Initial Item 1</li>
      </ul>
    </div>
