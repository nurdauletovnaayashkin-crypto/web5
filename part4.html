<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 4 - Interactive To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="brand">Assignment #5</a>
    <ul>
      <li><a href="index.html">Part 1</a></li>
      <li><a href="part2.html">Part 2</a></li>
      <li><a href="part3.html">Part 3</a></li>
      <li><a href="part4.html" class="active">Part 4</a></li>
    </ul>
  </nav>

  <main class="main-container">
    <div class="todo-layout">
      <div class="card">
        <h2>To-do list</h2>
        <div id="todoContainer"></div>
      </div>

      <div class="card">
        <h2>Add new task</h2>
        <label><strong>* Title</strong></label>
        <input type="text" id="taskTitle" class="input-pink" placeholder="Task Title">
        
        <label><strong>* Description</strong></label>
        <textarea id="taskDesc" class="input-pink" rows="4" placeholder="Task Description"></textarea>

        <button class="btn-pink" id="addTaskBtn" style="width: 100%;">Add task</button>
      </div>
    </div>
  </main>

  <footer>Assignment #5 — JavaScript Basics</footer>
  <script src="js/todo.js"></script>
</body>
</html>
